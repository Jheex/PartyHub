<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartyHub</title>

    <style>
        body{
            background-color: #030712;
            margin: 0;
        }

        header{
            font-family: fantasy;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 10px;
        }

        .games-grid{
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            margin: 30px;
        }

        .games-card{
            color: aliceblue;
            background: rgb(60, 60, 61);
            border: 10px;
            border-radius: 10px;
            margin: 20px;
            text-align: center;
            cursor: pointer
        }

        .game-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 8px;
        }

        .game-image img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #letra1{
            color: rgb(4, 196, 255);
        }

        #letra2{
            color: orange;
        }
        #letra3{
            color: rgb(255, 0, 0);
        }
        #letra4{
            color: rgb(4, 230, 11);
        }
        #letra5{
            color: rgb(131, 255, 234);
        }
        #letra6{
            color: rgb(255, 0, 0);
        }
        #letra7{
            color: orange;
        }
        #letra8{
            color: rgb(4, 196, 255);
        }

    </style>
</head>

<body>
    <header>
        <h2 id="titulo">
                <span id="letra1">P</span>
                <span id="letra2">A</span>
                <span id="letra3">R</span>
                <span id="letra4">T</span>
                <span id="letra5">Y</span>
                <span id="letra6">H</span>
                <span id="letra7">U</span>
                <span id="letra8">B</span>
            </h2>
    </header>

    <section>
        <div class="games-grid">
            <article class="games-card">
                <div class="game-image">
                    <img src="jogos/termo.png" alt="Termo">
                </div>
                <h3>Termo</h3>
            </article>

            <article class="games-card">
                <div class="game-image">
                    <img src="jogos/xadrez.png" alt="Xadrez">
                </div>
                <h3>Xadrez</h3>
            </article>

            <article class="games-card">
                <div class="game-image">
                    <img src="jogos/labirinto.png" alt="Labirinto">
                </div>
                <h3>Labirinto</h3>
            </article>

            <article class="games-card">
                <div class="game-image">
                    <img src="jogos/nonograma.png" alt="Nonograma">
                </div>
                <h3>Nonograma</h3>
            </article>

            <article class="games-card">
                <div class="game-image">
                    <img src="jogos/sudoku.png" alt="Sudoku">
                </div>
                <h3>Sudoku</h3>
            </article>

            <article class="games-card">
                <div class="game-image">
                    <img src="jogos/cacapalavras.png" alt="Caça Palavras">
                </div>
                <h3>Caça Palavras</h3>
            </article>

            <article class="games-card">
                <div class="game-image">
                    <img src="jogos/cores.png" alt="Cores">
                </div>
                <h3>Cores</h3>
            </article>

            <article class="games-card">
                <div class="game-image">
                    <img src="jogos/snake.png" alt="Snake">
                </div>
                <h3>Snake</h3>
            </article>
        </div>

    </section>

    
    
</body>
</html>
